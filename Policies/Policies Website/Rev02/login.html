<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .login-container { max-width: 300px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <div class="form-group">
        <label for="user">Username:</label>
        <input id="user" type="text" autocomplete="username">
    </div>

    <div class="form-group">
        <label for="pass">Password:</label>
        <input id="pass" type="password" autocomplete="current-password">
    </div>

    <button onclick="login()">Login</button>
</div>

<script>
async function login() {
    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    try {
        const response = await fetch("accounts.csv");
        if (!response.ok) {
            alert("Error loading account data.");
            return;
        }
        
        const csv = await response.text();
        const rows = csv.trim().split("\n").slice(1);

        for (let row of rows) {
            const [u, p] = row.split(",").map(item => item.trim());
            if (u === user && p === pass) {
                localStorage.setItem("loggedInUser", user);
                // Redirect to the main interface page
                window.location.href = "index.html";
                return;
            }
        }

        alert("Invalid username or password");
    } catch (error) {
        console.error("Login script error:", error);
        alert("Failed to connect to the server.");
    }
}
</script>

</body>
</html>
